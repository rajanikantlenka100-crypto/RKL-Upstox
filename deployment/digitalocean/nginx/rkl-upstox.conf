server {
    listen 443 ssl;
    server_name dashboard.example.invalid;

    # Supply real certificate paths and authentication before enabling remote access.
    ssl_certificate /etc/letsencrypt/live/dashboard.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.example.invalid/privkey.pem;
    auth_basic "RKL dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd-rkl;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
